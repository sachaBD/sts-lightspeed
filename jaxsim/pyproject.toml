[project]
name = "jaxsim"
version = "0.0.1"
description = "Fixed-shape, pure-function JAX simulator for Ironclad vs The Champ"
requires-python = ">=3.12"
dependencies = ["jax>=0.7", "numpy>=2"]

[project.optional-dependencies]
cuda = ["jax[cuda12]>=0.7"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jaxsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
